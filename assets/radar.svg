<svg width="1200" height="300" viewBox="0 0 1200 300"
xmlns="http://www.w3.org/2000/svg">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#050510"/>
    <stop offset="55%" stop-color="#001f3f"/>
    <stop offset="100%" stop-color="#080020"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge>
      <feMergeNode in="b"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <style>
    .spin {
      transform-origin: 600px 150px;
      animation: rotate 4s linear infinite;
    }

    .blink {
      animation: blink 1.5s infinite;
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes blink {
      0%,100% { opacity:.25; }
      50% { opacity:1; }
    }

    .title {
      font: bold 19px Arial;
      fill: #00ffff;
      letter-spacing: 3px;
    }

    .text {
      font: 13px Arial;
      fill: #8fdfff;
      letter-spacing: 2px;
    }
  </style>
</defs>

<rect width="1200" height="300" rx="20"
fill="url(#bg)" stroke="#0088ff" stroke-width="2"/>

<!-- RADAR -->
<circle cx="600" cy="150" r="105"
fill="none" stroke="#00ffff" opacity=".35"/>

<circle cx="600" cy="150" r="75"
fill="none" stroke="#00ffff" opacity=".35"/>

<circle cx="600" cy="150" r="45"
fill="none" stroke="#00ffff" opacity=".45"/>

<line x1="480" y1="150" x2="720" y2="150"
stroke="#00ffff" opacity=".25"/>

<line x1="600" y1="30" x2="600" y2="270"
stroke="#00ffff" opacity=".25"/>

<!-- SWEEP -->
<path d="M600 150 L600 45 A105 105 0 0 1 690 97 Z"
fill="#00ffff"
opacity=".18"
class="spin"/>

<line x1="600" y1="150" x2="600" y2="45"
stroke="#00ffff"
stroke-width="3"
filter="url(#glow)"
class="spin"/>

<!-- TARGETS -->
<circle cx="555" cy="105" r="5"
fill="#00ffff"
filter="url(#glow)"
class="blink"/>

<circle cx="670" cy="175" r="5"
fill="#0088ff"
filter="url(#glow)"
class="blink"/>

<circle cx="530" cy="195" r="5"
fill="#8a2be2"
filter="url(#glow)"
class="blink"/>

<circle cx="600" cy="150" r="7"
fill="#00ffff"
filter="url(#glow)"/>

<text x="600" y="22"
text-anchor="middle"
class="title">
J.A.R.V.I.S // NEURAL RADAR
</text>

<text x="600" y="292"
text-anchor="middle"
class="text">
SCANNING • NEURAL NETWORK • SYSTEM SIGNALS
</text>

</svg>
