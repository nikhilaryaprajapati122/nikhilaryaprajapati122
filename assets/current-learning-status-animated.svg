      fill="#00efff"
      font-family="monospace"
      font-size="28"
      font-weight="bold"
      letter-spacing="4"
      filter="url(#glow)">

  CURRENT LEARNING STATUS

  <animate
    attributeName="opacity"
    values="0.55;1;0.55"
    dur="2.3s"
    repeatCount="indefinite"/>

</text>


