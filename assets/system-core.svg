<svg width="900" height="180" viewBox="0 0 900 180"
xmlns="http://www.w3.org/2000/svg">

<defs>
  <linearGradient id="line" x1="0%" x2="100%">
    <stop offset="0%" stop-color="#00ffff"/>
    <stop offset="50%" stop-color="#0088ff"/>
    <stop offset="100%" stop-color="#8a2be2"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge>
      <feMergeNode in="b"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<!-- Outer panel -->
<rect x="5" y="5" width="890" height="170" rx="14"
fill="#050510"
stroke="url(#line)"
stroke-width="2"
filter="url(#glow)"/>

<!-- Header -->
<text x="35" y="38"
font-family="monospace"
font-size="15"
font-weight="bold"
fill="#00ffff">
J.A.R.V.I.S // CORE MONITOR
</text>

<!-- Divider -->
<line x1="30" y1="52" x2="870" y2="52"
stroke="#0088ff"
stroke-opacity=".5"/>

<!-- JAVA -->
<text x="35" y="82"
font-family="monospace"
font-size="12"
fill="#ffffff">
JAVA CORE
</text>

<rect x="150" y="72" width="230" height="10"
rx="5" fill="#101020"/>

<rect x="150" y="72" width="190" height="10"
rx="5" fill="#00ffff">
<animate attributeName="width"
values="170;200;190"
dur="2s"
repeatCount="indefinite"/>
</rect>

<text x="395" y="82"
font-family="monospace"
font-size="11"
fill="#00ffff">
ONLINE
</text>

<!-- PYTHON -->
<text x="35" y="112"
font-family="monospace"
font-size="12"
fill="#ffffff">
PYTHON CORE
</text>

<rect x="150" y="102" width="230" height="10"
rx="5" fill="#101020"/>

<rect x="150" y="102" width="160" height="10"
rx="5" fill="#0088ff">
<animate attributeName="width"
values="145;175;160"
dur="2.5s"
repeatCount="indefinite"/>
</rect>

<text x="395" y="112"
font-family="monospace"
font-size="11"
fill="#0088ff">
ACTIVE
</text>

<!-- AI -->
<text x="35" y="142"
font-family="monospace"
font-size="12"
fill="#ffffff">
AI CORE
</text>

<rect x="150" y="132" width="230" height="10"
rx="5" fill="#101020"/>

<rect x="150" y="132" width="120" height="10"
rx="5" fill="#8a2be2">
<animate attributeName="width"
values="105;135;120"
dur="3s"
repeatCount="indefinite"/>
</rect>

<text x="395" y="142"
font-family="monospace"
font-size="11"
fill="#8a2be2">
DEVELOPING
</text>

<!-- Right status -->
<g font-family="monospace">
<text x="610" y="82" font-size="11" fill="#00ffff">
● SYSTEM ONLINE
</text>

<text x="610" y="108" font-size="11" fill="#0088ff">
● NEURAL LINK ACTIVE
</text>

<text x="610" y="134" font-size="11" fill="#8a2be2">
● BUILD MODE ENABLED
</text>

<text x="610" y="158" font-size="10" fill="#ffffff">
STATUS : READY
</text>
</g>

</svg>
