<svg width="1200" height="360" viewBox="0 0 1200 360"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Dark futuristic background -->
    <linearGradient id="background"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02050B"/>
      <stop offset="50%" stop-color="#071722"/>
      <stop offset="100%" stop-color="#010308"/>
    </linearGradient>

    <!-- Neon cyan -->
    <linearGradient id="neon"
                    x1="0%" y1="0%"
                    x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A8FF"/>
      <stop offset="50%" stop-color="#00FFFF"/>
      <stop offset="100%" stop-color="#00A8FF"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- BACKGROUND -->
  <rect x="0" y="0"
        width="1200"
        height="360"
        rx="22"
        fill="url(#background)"/>

  <!-- OUTER FRAME -->
  <rect x="10" y="10"
        width="1180"
        height="340"
        rx="22"
        fill="none"
        stroke="url(#neon)"
        stroke-width="3"
        filter="url(#glow)"/>

  <!-- INNER FRAME -->
  <rect x="25" y="25"
        width="1150"
        height="310"
        rx="16"
        fill="none"
        stroke="#00E5FF"
        stroke-width="1"
        opacity="0.35"/>

  <!-- TOP HUD LINE -->
  <line x1="150" y1="78"
        x2="1050" y2="78"
        stroke="#00E5FF"
        stroke-width="1"
        opacity="0.4"/>

  <!-- SYSTEM LABEL -->
  <text x="600" y="65"
      text-anchor="middle"
      fill="#00E5FF"
      font-family="monospace"
      font-size="17"
      font-weight="bold"
      letter-spacing="5">

  J.A.R.V.I.S. // SYSTEM ONLINE

  <animate
    attributeName="opacity"
    values="0.45;1;0.45"
    dur="2s"
    repeatCount="indefinite"/>

</text>

  <!-- MAIN NAME -->
  <text x="600" y="155"
        text-anchor="middle"
        fill="#FFFFFF"
        font-family="monospace"
        font-size="48"
        font-weight="bold"
        letter-spacing="5"
        filter="url(#glow)">
    NIKHIL ARYA PRAJAPATI
  </text>

  <!-- NAME UNDERLINE -->
  <line x1="300" y1="180"
        x2="900" y2="180"
        stroke="url(#neon)"
        stroke-width="2"
        filter="url(#glow)"/>

  <!-- SUBTITLE -->
  <text x="600" y="220"
        text-anchor="middle"
        fill="#00E5FF"
        font-family="monospace"
        font-size="17"
        letter-spacing="3">
    SOFTWARE ENGINEERING • JAVA • PYTHON • WEB
  </text>

  <!-- HUD STATUS -->
  <text x="600" y="270"
        text-anchor="middle"
        fill="#8BEFFF"
        font-family="monospace"
        font-size="14"
        letter-spacing="3">
    [ CORE: READY ]  [ ACCESS: GRANTED ]  [ STATUS: ONLINE ]
  </text>

     <!-- SCANNING LINE -->

<rect x="80" y="95"
      width="1040"
      height="2"
      fill="#00E5FF"
      opacity="0.75">

  <animate
    attributeName="x"
    from="80"
    to="1080"
    dur="3s"
    repeatCount="indefinite"/>

</rect>

<!-- HUD SCAN GRID -->

<g opacity="0.12" stroke="#00E5FF" stroke-width="1">

  <line x1="100" y1="110" x2="1100" y2="110"/>
  <line x1="100" y1="130" x2="1100" y2="130"/>
  <line x1="100" y1="150" x2="1100" y2="150"/>
  <line x1="100" y1="170" x2="1100" y2="170"/>
  <line x1="100" y1="190" x2="1100" y2="190"/>
  <line x1="100" y1="210" x2="1100" y2="210"/>
  <line x1="100" y1="230" x2="1100" y2="230"/>
  <line x1="100" y1="250" x2="1100" y2="250"/>

</g>

     <!-- SYSTEM INDICATORS -->

<text x="260" y="288"
      text-anchor="middle"
      fill="#00E5FF"
      font-family="monospace"
      font-size="12"
      letter-spacing="2">
  ● CORE ACTIVE
</text>

<text x="600" y="288"
      text-anchor="middle"
      fill="#00E5FF"
      font-family="monospace"
      font-size="12"
      letter-spacing="2">
  ● SECURE
</text>

<text x="940" y="288"
      text-anchor="middle"
      fill="#00E5FF"
      font-family="monospace"
      font-size="12"
      letter-spacing="2">
  ● ONLINE
</text>
     
  <!-- BOTTOM HUD LINE -->
  <line x1="150" y1="300"
        x2="1050" y2="300"
        stroke="#00E5FF"
        stroke-width="1"
        opacity="0.4"/>

  <!-- CORNER MARKERS -->
  <path d="M45 55 H100 M45 55 V100"
        stroke="#00E5FF"
        stroke-width="3"/>

  <path d="M1155 55 H1100 M1155 55 V100"
        stroke="#00E5FF"
        stroke-width="3"/>

  <path d="M45 305 H100 M45 305 V260"
        stroke="#00E5FF"
        stroke-width="3"/>

  <path d="M1155 305 H1100 M1155 305 V260"
        stroke="#00E5FF"
        stroke-width="3"/>

</svg>
