<svg width="1200" height="760" viewBox="0 0 1200 760"
xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#01040a"/>
    <stop offset="45%" stop-color="#061722"/>
    <stop offset="100%" stop-color="#010207"/>
  </linearGradient>

  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#0077ff"/>
    <stop offset="50%" stop-color="#00f5ff"/>
    <stop offset="100%" stop-color="#0077ff"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="strongGlow">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <pattern id="grid"
           width="40"
           height="40"
           patternUnits="userSpaceOnUse">

    <path d="M40 0H0V40"
          fill="none"
          stroke="#00dfff"
          stroke-width="1"
          opacity="0.07"/>

  </pattern>

</defs>


<!-- ================================================= -->
<!-- BACKGROUND -->
<!-- ================================================= -->

<rect width="1200"
      height="760"
      rx="26"
      fill="url(#bg)"/>

<rect x="28"
      y="28"
      width="1144"
      height="704"
      rx="20"
      fill="url(#grid)"/>


<!-- ================================================= -->
<!-- OUTER HUD FRAME -->
<!-- ================================================= -->

<rect x="12"
      y="12"
      width="1176"
      height="736"
      rx="25"
      fill="none"
      stroke="#00eaff"
      stroke-width="3"
      opacity="0.35"
      filter="url(#glow)">

  <animate attributeName="opacity"
           values="0.2;0.8;0.2"
           dur="3s"
           repeatCount="indefinite"/>

</rect>

<rect x="12"
      y="12"
      width="1176"
      height="736"
      rx="25"
      fill="none"
      stroke="url(#neon)"
