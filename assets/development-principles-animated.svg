<svg width="1200" height="560" viewBox="0 0 1200 560"
     xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#02060d"/>
    <stop offset="50%" stop-color="#071923"/>
    <stop offset="100%" stop-color="#010308"/>
  </linearGradient>

  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#008cff"/>
    <stop offset="50%" stop-color="#00f5ff"/>
    <stop offset="100%" stop-color="#008cff"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <pattern id="grid"
           width="40"
           height="40"
           patternUnits="userSpaceOnUse">

    <path d="M40 0H0V40"
          fill="none"
          stroke="#00dfff"
          stroke-width="1"
          opacity="0.08"/>

  </pattern>

</defs>


<!-- BACKGROUND -->

<rect width="1200"
      height="560"
      rx="24"
      fill="url(#bg)"/>

<rect x="28"
      y="28"
      width="1144"
      height="504"
      rx="18"
      fill="url(#grid)"/>


<!-- NEON FRAME -->

<rect x="12"
      y="12"
      width="1176"
      height="536"
      rx="22"
      fill="none"
      stroke="#00eaff"
      stroke-width="3"
      opacity="0.35"
      filter="url(#glow)">

  <animate
    attributeName="opacity"
    values="0.2;0.8;0.2"
    dur="3s"
    repeatCount="indefinite"/>

</rect>

<rect x="12"
      y="12"
      width="1176"
      height="536"
      rx="22"
      fill="none"
      stroke="url(#neon)"
      stroke-width="2"/>


<!-- HEADER -->

<text x="600"
      y="68"
      text-anchor="middle"
      fill="#00efff"
      font-family="monospace"
      font-size="28"
      font-weight="bold"
      letter-spacing="5"
      filter="url(#glow)">

  DEVELOPMENT PRINCIPLES

  <animate
    attributeName="opacity"
    values="0.55;1;0.55"
    dur="2.3s"
    repeatCount="indefinite"/>

</text>


<text x="600"
      y="95"
      text-anchor="middle"
      fill="#66ddeb"
      font-family="monospace"
      font-size="11"
      letter-spacing="4">

  J.A.R.V.I.S. // PROTOCOL CORE

</text>


<line x1="90"
      y1="115"
      x2="1110"
      y2="115"
      stroke="#00eaff"
      opacity="0.35"/>


<!-- MOVING SCAN -->

