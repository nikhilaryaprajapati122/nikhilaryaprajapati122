<svg width="1200" height="520" viewBox="0 0 1200 520"
     xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- Background -->
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#02060d"/>
    <stop offset="50%" stop-color="#071923"/>
    <stop offset="100%" stop-color="#010308"/>
  </linearGradient>

  <!-- Neon -->
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#008cff"/>
    <stop offset="50%" stop-color="#00f5ff"/>
    <stop offset="100%" stop-color="#008cff"/>
  </linearGradient>

  <!-- Glow -->
  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <!-- HUD Grid -->
  <pattern id="grid"
           width="40"
           height="40"
           patternUnits="userSpaceOnUse">

    <path d="M40 0H0V40"
          fill="none"
          stroke="#00dfff"
          stroke-width="1"
          opacity="0.08"/>

  </pattern>

</defs>


<!-- ================================================= -->
<!-- BACKGROUND -->
<!-- ================================================= -->

<rect width="1200"
      height="520"
      rx="24"
      fill="url(#bg)"/>

<rect x="28"
      y="28"
      width="1144"
      height="464"
      rx="18"
      fill="url(#grid)"/>


<!-- ================================================= -->
<!-- OUTER NEON FRAME -->
<!-- ================================================= -->

<rect x="12"
      y="12"
      width="1176"
      height="496"
      rx="22"
      fill="none"
      stroke="#00eaff"
      stroke-width="3"
      opacity="0.35"
      filter="url(#glow)">

  <animate
    attributeName="opacity"
    values="0.2;0.8;0.2"
    dur="3s"
    repeatCount="indefinite"/>

</rect>


<rect x="12"
      y="12"
      width="1176"
      height="496"
      rx="22"
      fill="none"
      stroke="url(#neon)"
      stroke-width="2"/>


<!-- ================================================= -->
<!-- HEADER -->
<!-- ================================================= -->

<text x="600"
      y="70"
      text-anchor="middle"
      fill="#00efff"
      font-family="monospace"
      font-size="28"
      font-weight="bold"
      letter-spacing="5"
      filter="url(#glow)">

  CURRENT MISSION

  <animate
    attributeName="opacity"
    values="0.55;1;0.55"
    dur="2.3s"
    repeatCount="indefinite"/>

</text>


<text x="600"
      y="96"
      text-anchor="middle"
      fill="#66ddeb"
      font-family="monospace"
      font-size="11"
      letter-spacing="4">

  J.A.R.V.I.S. // MISSION CONTROL

</text>


<line x1="90"
      y1="115"
      x2="1110"
      y2="115"
      stroke="#00eaff"
      opacity="0.35"/>


<!-- ================================================= -->
<!-- MOVING SCAN BEAM -->
<!-- ================================================= -->

<rect x="75"
      y="125"
      width="1050"
      height="3"
      fill="#00f5ff"
      opacity="0.65"
      filter="url(#glow)">

  <animate
    attributeName="y"
    values="125;435;125"
    dur="5.5s"
    repeatCount="indefinite"/>

</rect>


<!-- ================================================= -->
<!-- MAIN MISSION PANEL -->
<!-- ================================================= -->

<rect x="65"
      y="140"
      width="1070"
      height="260"
      rx="16"
      fill="#06121b"
      fill-opacity="0.93"
      stroke="#00dfff"
      stroke-width="1.5"/>


<!-- MISSION -->

<text x="105"
      y="180"
      fill="#8befff"
      font-family="monospace"
      font-size="14"
      font-weight="bold">

  MISSION

</text>

<text x="400"
      y="180"
      fill="#ffffff"
      font-family="monospace"
      font-size="18"
      font-weight="bold">

  LEARN → CODE → BUILD → IMPROVE

</text>


<!-- MODE -->

<text x="105"
      y="220"
      fill="#8befff"
      font-family="monospace"
      font-size="14"
      font-weight="bold">

  MODE

</text>

<text x="400"
      y="220"
      fill="#00ffb7"
      font-family="monospace"
      font-size="16">

  SOFTWARE ENGINEERING

</text>


<!-- PRIMARY -->

<text x="105"
      y="260"
      fill="#8befff"
      font-family="monospace"
      font-size="14"
      font-weight="bold">

  PRIMARY

</text>

<text x="400"
      y="260"
      fill="#00ffb7"
      font-family="monospace"
      font-size="16">

  JAVA

</text>


<!-- SECONDARY -->

<text x="105"
      y="300"
      fill="#8befff"
      font-family="monospace"
      font-size="14"
      font-weight="bold">

  SECONDARY

</text>

<text x="400"
      y="300"
      fill="#00ffb7"
      font-family="monospace"
      font-size="16">

  PYTHON

</text>


<!-- INTERFACE -->

<text x="105"
      y="340"
      fill="#8befff"
      font-family="monospace"
      font-size="14"
      font-weight="bold">

  INTERFACE

</text>

<text x="400"
      y="340"
      fill="#00ffb7"
      font-family="monospace"
      font-size="16">

  WEB DEVELOPMENT

</text>


<!-- STATUS -->

<text x="105"
      y="380"
      fill="#8befff"
      font-family="monospace"
      font-size="14"
      font-weight="bold">

  STATUS

</text>


<circle cx="405"
        cy="374"
        r="6"
        fill="#00ffb7"
        filter="url(#glow)">

  <animate
    attributeName="opacity"
    values="0.2;1;0.2"
    dur="1.3s"
    repeatCount="indefinite"/>

</circle>


<text x="425"
      y="380"
      fill="#00ffb7"
      font-family="monospace"
      font-size="16">

  LEARNING &amp; BUILDING

</text>


<!-- ================================================= -->
<!-- MISSION CORE -->
<!-- ================================================= -->

<rect x="65"
      y="420"
      width="1070"
      height="45"
      rx="12"
      fill="#06121b"
      stroke="#00dfff"
      stroke-width="1.2"/>


<text x="600"
      y="449"
      text-anchor="middle"
      fill="#00efff"
      font-family="monospace"
      font-size="12"
      letter-spacing="3">

  UNDERSTAND • PRACTICE • BUILD • DEBUG • IMPROVE

</text>


<!-- ================================================= -->
<!-- BOTTOM SCANNER -->
<!-- ================================================= -->

<rect x="65"
      y="482"
      width="1070"
      height="2"
      fill="#00eaff"
      opacity="0.2"/>


<rect x="65"
      y="482"
      width="180"
      height="2"
      fill="#00f5ff"
      filter="url(#glow)">

  <animate
    attributeName="x"
    values="65;955;65"
    dur="3.8s"
    repeatCount="indefinite"/>

</rect>

</svg>
