      stroke-width="1.5"/>

<circle cx="650"
        cy="310"
        r="8"
        fill="#00ffb7"
        filter="url(#glow)">

  <animate attributeName="opacity"
           values="0.2;1;0.2"
           dur="1.9s"
           repeatCount="indefinite"/>

</circle>

<text x="680"
      y="307"
      fill="#00efff"
      font-family="monospace"
      font-size="14"
      font-weight="bold">

  CURRENT MODE

</text>

<text x="680"
      y="337"
      fill="#ffffff"
      font-family="monospace"
      font-size="13">

