      font-family="monospace"
      font-size="13">

  PUBLIC PROJECTS

</text>

<text x="535"
      y="207"
      text-anchor="end"
      fill="#00ffb7"
      font-family="monospace"
      font-size="12">

  ● MONITORED

</text>


