<svg width="1200" height="330" viewBox="0 0 1200 330"
xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#020208"/>
    <stop offset="45%" stop-color="#001f3f"/>
    <stop offset="75%" stop-color="#100020"/>
    <stop offset="100%" stop-color="#020208"/>
  </linearGradient>

  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#00ffff"/>
    <stop offset="45%" stop-color="#0088ff"/>
    <stop offset="75%" stop-color="#8a2be2"/>
    <stop offset="100%" stop-color="#00ffff"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <style>

    .title {
      font:bold 30px Arial;
      fill:#00ffff;
      letter-spacing:6px;
    }

    .subtitle {
      font:13px monospace;
      fill:#8fdfff;
      letter-spacing:3px;
    }

    .message {
      font:bold 16px monospace;
      fill:#ffffff;
      letter-spacing:2px;
    }

    .pulse {
      animation:pulse 1.8s infinite;
    }

    .scan {
      animation:scan 3s linear infinite;
    }

    @keyframes pulse {
      0%,100% { opacity:.3; }
      50% { opacity:1; }
    }

    @keyframes scan {
      0% {
        transform:translateY(-120px);
        opacity:0;
      }

      20% { opacity:.7; }

      80% { opacity:.3; }

      100% {
        transform:translateY(120px);
        opacity:0;
      }
    }

  </style>

</defs>


<!-- MAIN BACKGROUND -->

<rect width="1200"
height="330"
rx="22"
fill="url(#bg)"
stroke="#00ffff"
stroke-width="2"/>


<!-- INNER FRAME -->

<rect x="14"
y="14"
width="1172"
height="302"
rx="18"
fill="none"
stroke="url(#neon)"
stroke-width="2"
opacity=".75"/>


<!-- TOP LINE -->

<line x1="70"
y1="62"
x2="1130"
y2="62"
stroke="url(#neon)"
stroke-width="2"/>


<!-- SYSTEM INDICATOR -->

<circle cx="105"
cy="105"
r="9"
fill="#00ffff"
filter="url(#glow)"
class="pulse"/>

<text x="125"
y="111"
class="subtitle">
J.A.R.V.I.S CORE
</text>


<text x="1095"
y="111"
text-anchor="end"
class="subtitle">
SYSTEM ONLINE
</text>


<!-- CENTER -->

<text x="600"
y="150"
text-anchor="middle"
class="title">
SYSTEM ONLINE
</text>


<text x="600"
y="178"
text-anchor="middle"
class="subtitle">
NIKHIL // DEVELOPMENT CORE
</text>


<!-- SCANNING LINE -->

<rect x="170"
y="195"
width="860"
height="2"
fill="#00ffff"
opacity=".5"
class="scan"/>


<!-- MESSAGE -->

<text x="600"
y="225"
text-anchor="middle"
class="message">
KEEP BUILDING • KEEP LEARNING • KEEP EVOLVING
</text>


<!-- STATUS -->

<circle cx="480"
cy="270"
r="6"
fill="#00ffff"
filter="url(#glow)"
class="pulse"/>

<text x="495"
y="275"
class="subtitle">
CORE : ACTIVE
</text>


<circle cx="705"
cy="270"
r="6"
fill="#8a2be2"
filter="url(#glow)"
class="pulse"/>

<text x="720"
y="275"
class="subtitle">
MISSION : RUNNING
</text>


<!-- BOTTOM LINE -->

<line x1="70"
y1="300"
x2="1130"
y2="300"
stroke="url(#neon)"
stroke-width="2"/>

</svg>
