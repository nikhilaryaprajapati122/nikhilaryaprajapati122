        stroke="#00dfff"
        stroke-width="2"
        filter="url(#glow)">

  <animate
    attributeName="r"
    values="40;44;40"
    dur="2s"
    repeatCount="indefinite"/>

</circle>


<circle cx="170"
        cy="270"
        r="10"
        fill="#00ffb7">

  <animate
    attributeName="opacity"
    values="0.3;1;0.3"
    dur="1.2s"
    repeatCount="indefinite"/>

</circle>


<text x="170"
      y="345"
      text-anchor="middle"
      fill="#00efff"
      font-family="monospace"
      font-size="15"
      font-weight="bold">

  UNDERSTAND

</text>


