<!-- ================================================= -->
<!-- BOTTOM SCANNER -->
<!-- ================================================= -->

<rect x="65"
      y="482"
      width="1070"
      height="2"
      fill="#00eaff"
      opacity="0.2"/>


<rect x="65"
