<svg width="1200" height="360" viewBox="0 0 1200 360"
xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#03030a"/>
    <stop offset="50%" stop-color="#001f3f"/>
    <stop offset="100%" stop-color="#09001f"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge>
      <feMergeNode in="b"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <style>

    .cursor {
      animation: blink 1s steps(2) infinite;
    }

    .scan {
      animation: scan 4s linear infinite;
    }

    @keyframes blink {
      50% { opacity:0; }
    }

    @keyframes scan {
      from { transform:translateY(-150px); opacity:0; }
      20% { opacity:.6; }
      80% { opacity:.3; }
      to { transform:translateY(150px); opacity:0; }
    }

    .title {
      font:bold 20px Arial;
      fill:#00ffff;
      letter-spacing:3px;
    }

    .cmd {
      font:15px monospace;
      fill:#8fdfff;
    }

    .success {
      font:bold 15px monospace;
      fill:#00ffff;
    }

    .dim {
      font:13px monospace;
      fill:#4da6d9;
    }

  </style>
</defs>

<!-- TERMINAL BODY -->

<rect width="1200" height="360"
rx="18"
fill="url(#bg)"
stroke="#00ffff"
stroke-width="2"/>

<rect x="12" y="12"
width="1176"
height="336"
rx="14"
fill="none"
stroke="#8a2be2"
opacity=".55"/>

<!-- HEADER -->

<circle cx="38" cy="38" r="6" fill="#ff4d6d"/>
<circle cx="60" cy="38" r="6" fill="#ffd166"/>
<circle cx="82" cy="38" r="6" fill="#00ffff"/>

<text x="110" y="44" class="title">
NIKHIL-CORE // TERMINAL
</text>

<!-- SCAN -->

<rect x="30" y="70"
width="1140"
height="2"
fill="#00ffff"
opacity=".4"
class="scan"/>

<!-- COMMANDS -->

<text x="45" y="105" class="cmd">
┌──(nikhil㉿github)-[~/future]
</text>

<text x="45" y="132" class="cmd">
└─$ whoami
</text>

<text x="250" y="132" class="success">
Nikhil Arya Prajapati
</text>

<text x="45" y="170" class="cmd">
└─$ systemctl status nikhil-core
</text>

<text x="45" y="198" class="success">
● nikhil-core.service → ACTIVE
</text>

<text x="45" y="225" class="dim">
STATUS: ONLINE • MODE: DEVELOPMENT
</text>

<text x="45" y="263" class="cmd">
└─$ ./mission.sh
</text>

<text x="45" y="289" class="success">
&gt; LEARN → BUILD → DEBUG → IMPROVE → REPEAT
</text>

<text x="45" y="320" class="cmd">
└─$ <tspan class="cursor">█</tspan>
</text>

<text x="1145" y="320"
text-anchor="end"
class="dim">
J.A.R.V.I.S TERMINAL LINK
</text>

</svg>
